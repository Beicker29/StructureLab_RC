name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Contratos de import
        run: lint-imports
      - name: Pytest
        run: pytest
      - name: Construir el wheel
        run: python -m build
      - name: Verificar los datos en el wheel
        run: python -m zipfile -l dist/*.whl | grep "structurelab_rc/data/rebar.csv"
      - name: Probar el wheel en un entorno limpio
        run: |
          wheel="$PWD/$(ls dist/*.whl)"
          example="$PWD/examples/nsr_10/beam_t.json"
          workbook="$PWD/examples/etabs/Element Forces - Beams.xlsx"
          template="$PWD/examples/etabs/plantilla_nsr10.json"
          cd "$RUNNER_TEMP"
          python -m venv clean
          if [ "$RUNNER_OS" = "Windows" ]; then bin=clean/Scripts; else bin=clean/bin; fi
          "$bin/python" -m pip install "$wheel"
          "$bin/structurelab-rc" --version
          "$bin/structurelab-rc" catalog
          "$bin/structurelab-rc" validate "$example"
          "$bin/structurelab-rc" verify "$example"
          "$bin/structurelab-rc" import-etabs "$workbook" "$template" --output etabs.json
          "$bin/structurelab-rc" validate etabs.json
