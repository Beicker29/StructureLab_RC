name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Instalar
        run: python -m pip install -e ".[dev,pdf]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Contratos de import
        run: lint-imports
      - name: Pytest
        run: pytest
      - name: Construir el wheel
        run: python -m build
      - name: Verificar los datos en el wheel
        run: python -m zipfile -l dist/*.whl | grep "structurelab_rc/data/rebar.csv"
      - name: Probar el wheel en un entorno limpio
        run: |
          # Ruta nativa del wheel (en Windows, Git Bash no convierte una ruta que termina en [pdf]).
          wheel=$(python -c "import glob, os; print(os.path.abspath(glob.glob('dist/*.whl')[0]))")
          example="$PWD/examples/nsr_10/vigas/viga_t.json"
          footing="$PWD/examples/nsr_10/zapatas/zapata_aislada.json"
          workbook="$PWD/examples/etabs/vigas/Element Forces - Beams.xlsx"
          template="$PWD/examples/etabs/vigas/plantilla_vigas_nsr10.json"
          footings="$PWD/examples/etabs/zapatas"
          cd "$RUNNER_TEMP"
          python -m venv clean
          if [ "$RUNNER_OS" = "Windows" ]; then bin=clean/Scripts; else bin=clean/bin; fi
          "$bin/python" -m pip install "$wheel[pdf]"
          "$bin/structurelab-rc" --version
          "$bin/structurelab-rc" catalog
          "$bin/structurelab-rc" validate "$example"
          "$bin/structurelab-rc" verify "$example"
          "$bin/structurelab-rc" import-etabs "$workbook" "$template" --output etabs.json
          "$bin/structurelab-rc" validate etabs.json
          "$bin/structurelab-rc" import-etabs-footings "$footings/Joint Reactions - Servicio.xlsx" "$footings/Joint Reactions - Ultimas.xlsx" "$footings/plantilla_zapatas_nsr10.json" --output zapatas.json
          "$bin/structurelab-rc" validate zapatas.json
          "$bin/structurelab-rc" validate "$footing"
          "$bin/structurelab-rc" report "$example" --output reporte
          test -s reporte/resultado.json && test -s reporte/memoria.txt && test -s reporte/memoria.pdf
